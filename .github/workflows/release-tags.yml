
name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  release-tags:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  publish-67minecraft:
    needs: release-tags
    if: ${{ vars.SIX_SEVEN_PROJECT_ID != '' }}
    uses: JackOfNoneTrades/67minecraft-gradle-publish/.github/workflows/publish-67minecraft.yml@1.0.1
    with:
      gradle-arguments: >-
        --no-configuration-cache --build-cache --info --stacktrace -x test
        -P67minecraftProjectId=${{ vars.SIX_SEVEN_PROJECT_ID }}
    secrets:
      SIX_SEVEN_TOKEN: ${{ secrets.SIX_SEVEN_TOKEN }}
